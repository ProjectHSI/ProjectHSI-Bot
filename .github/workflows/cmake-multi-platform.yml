name: CMake on multiple platforms

on:
  - push
  - pull_request
  - workflow_dispatch

env: 
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-checkout:
    name: Pre-checkout
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout ProjectHSI-Bot
        with:
          submodules: recursive

      - name: Upload Checkout Artifact
        uses: actions/upload-artifact@v4.0.0
        with:
          name: checkout-${{ github.sha }}
          path: |
            ${{ github.workspace }}
          if-no-files-found: error
          retention-days: 0

  build:
    runs-on: ${{ matrix.os }}

    needs: build-checkout

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
      # MacOS is disabled due to configuration errors.
        os:
          - windows-latest
          - ubuntu-latest
        #  - macos-latest
        build_type: 
          - release
          - debug
        build_arch: 
          - x64
          - x86
          - Win32
          - ARM
          - ARM64
        c_compiler: 
          - gcc
          - clang
          - cl
        cpp_compiler:
          - g++
          - clang++
          - cl
        exclude:
          - os: ubuntu-latest
            build_arch: x86
          - os: ubuntu-latest
            build_arch: Win32
          - os: ubuntu-latest
            build_arch: ARM
          - os: ubuntu-latest
            build_arch: ARM64

          - os: windows-latest
            build_arch: x86

          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang

          - os: ubuntu-latest
            c_compiler: cl

          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: clang

          - c_compiler: clang
            cpp_compiler: g++
          - c_compiler: gcc
            cpp_compiler: clang++
          - c_compiler: gcc
            cpp_compiler: cl
          - c_compiler: clang
            cpp_compiler: cl

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Download pre-checkout
        uses: actions/download-artifact@v4.1.7
        with:
          name: checkout-${{ github.sha }}
          
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Output Environment Variables
        run: env

      - name: Configure CMake on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: >
          cmake -G "Visual Studio 17 2022"
          -A ${{ matrix.build_arch }}
          -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          --preset ${{ matrix.build_arch }}-${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Configure CMake on Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: >
          cmake
          -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          --preset ${{ matrix.build_arch }}-${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

      - name: Create Output Directory
        run: |
          mkdir ${{ github.workspace }}/dist/
          mkdir ${{ github.workspace }}/dist/modules/

      - name: Copy Build Artifacts For Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Copy-Item -Path ${{ steps.strings.outputs.build-output-dir }}/ProjectHSI-Bot/${{ matrix.build_type }}/* -Destination ${{ github.workspace }}/dist/
          #Copy-Item -Path ${{ steps.strings.outputs.build-output-dir }}/third_party/SDL/Release/SDL2.dll -Destination ${{ github.workspace }}/dist/SDL2.dll
          Copy-Item -Path ${{ steps.strings.outputs.build-output-dir }}/ProjectHSI-Bot-Interface-Default-SDL-GUI/${{ matrix.build_type }}/* -Destination ${{ github.workspace }}/dist/modules/

      - name: Copy Build Artifacts For MacOS
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          cp ${{ steps.strings.outputs.build-output-dir }}/ProjectHSI-Bot/ProjectHSI-Bot ${{ github.workspace }}/dist/ProjectHSI-Bot
          #cp ${{ github.workspace }}/build/third_party/SDL/libSDL2-2.0.dylib ${{ github.workspace }}/dist/libSDL2-2.0.dylib
          cp ${{ steps.strings.outputs.build-output-dir }}/Project-HSI-Bot-Interface-Default-SDL-GUI/* ${{ github.workspace }}/dist/modules/

      - name: Copy Build Artifacts For Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          cp ${{ steps.strings.outputs.build-output-dir }}/ProjectHSI-Bot/* ${{ github.workspace }}/dist/
          #cp ${{ github.workspace }}/build/third_party/SDL/libSDL2-2.0.so ${{ github.workspace }}/dist/libSDL2-2.0.so
          cp ${{ steps.strings.outputs.build-output-dir }}/Project-HSI-Bot-Interface-Default-SDL-GUI/* ${{ github.workspace }}/dist/modules/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.0.0
        with:
          name: ${{ github.sha }}-${{ matrix.os }}-${{ matrix.build_arch }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}
          path: |
            ${{ github.workspace }}/dist/
          if-no-files-found: error
          retention-days: 0